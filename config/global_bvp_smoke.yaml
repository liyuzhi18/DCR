solver:
  mode: full_dcr
  spatial_method: experimental_global_bvp
io:
  output_dir: output/global_bvp_smoke
  atomic_data_root: atomic_data/
  data_tables_root: data_tables/
  verbose_logging: true
species:
- name: H_Atom
  filename: sclit.01
  is_molecule: false
- name: H2_Molecule
  filename: sclit_M.01
  is_molecule: true
grid:
  length_cm: 0.001
  num_cells: 2
  type: linear
  first_cell_cm: 0.0
  poloidal_width_cm: 1.0
global_bvp:
  ion_velocity_transition_length_cm: 100.0
  ion_upstream_speed_fraction: 0.01
  final_domain_length_cm: 1.0
plasma:
  total_density_cm3: 1e16
  Te_eV: 1.0
  Ti_eV: 1.0
  neutral_atom_temperature_eV: 0.1
  neutral_molecule_temperature_eV: 0.1
  initial_conditions:
  - index: 0
    fraction: 0.2
  - index: 1
    fraction: 0.6
  - index: 31
    fraction: 0.1
wall:
  material: W
  sheath_potential_drop: 4.0
  temperature_eV: 0.1
numerics:
  tolerance: 1.0e-07
  max_iterations: 5000
  relaxation: 0.9
  h2_dissociation_model: reconstructed
  boundary_solver: newton_krylov_ptc
  boundary_tolerance: 1.0e-06
  boundary_max_iterations: 300
  boundary_neutral_exhaust: true
  boundary_molecular_flow_acceptance: 1.0
  marching_solver: picard
  marching_tolerance: 3.0e-06
  marching_max_iterations: 300
  adaptive_recycling_domain:
    enabled: false

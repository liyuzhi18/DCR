io:
  # Effective atomic rates and QSS diagnostics are written to dcr_results.h5
  # under /rates for every run.
  output_dir: output/2eV
  atomic_data_root: atomic_data/
  data_tables_root: data_tables/
  # Keep this enabled if you want SCD/ACD and QSS summaries in the terminal log.
  verbose_logging: true
species:
- name: H_Atom
  filename: sclit.01
  is_molecule: false
- name: H2_Molecule
  filename: sclit_M.01
  is_molecule: true
grid:
  length_cm: 1
  num_cells: 100
  type: log
  first_cell_cm: 0.001
  poloidal_width_cm: 1.0
plasma:
  total_density_cm3: 1e15
  Te_eV: 2.0
  Ti_eV: 2.0
  neutral_atom_temperature_eV: 0.1
  neutral_molecule_temperature_eV: 0.1
  initial_conditions:
  - index: 0
    fraction: 0.1
  - index: 1
    fraction: 0.88
  - index: 31
    fraction: 0.01
wall:
  material: W
  sheath_potential_drop: 4.0
  temperature_eV: 0.1
numerics:
  tolerance: 1.0e-6
  max_iterations: 1000
  relaxation: 0.2
  marching_slow_iter_threshold: 1000
  marching_guess_retries: 3
  h2_dissociation_model: mccc
